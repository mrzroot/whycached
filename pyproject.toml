[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "whycached"
dynamic = ["version"]
description = "Deployed but still seeing the old version? Finds which cache layer (CDN, browser, service worker, asset names) is serving it, and how to bust it."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mohammadreza Zare", email = "mrzroot@users.noreply.github.com" }]
keywords = ["cache", "cdn", "stale", "deploy", "service-worker", "cloudflare", "http", "ai-agents", "vibe-coding", "developer-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Debuggers",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://mrzroot.github.io/whycached/"
Source = "https://github.com/mrzroot/whycached"
Issues = "https://github.com/mrzroot/whycached/issues"

[project.scripts]
whycached = "whycached.cli:main"

[tool.setuptools.dynamic]
version = { attr = "whycached.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
